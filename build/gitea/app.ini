; The lab's Gitea server. A complete, installed configuration baked into the image so there is no
; install wizard: INSTALL_LOCK is set, SQLite lives on the /data volume, SSH is off (the lab uses
; HTTP only for git). The SECRET_KEY / INTERNAL_TOKEN here are fixed lab values, NOT secrets of the
; challenge (the only per-player secret is the Jenkins `flag` credential, injected at run time; the
; artifact server's key is a separate fixed lab value).
APP_NAME = Cov & Wonderland Git
RUN_USER = git
RUN_MODE = prod
WORK_PATH = /data

[server]
PROTOCOL = http
DOMAIN = gitea
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
ROOT_URL = http://gitea:3000/
DISABLE_SSH = true
START_SSH_SERVER = false
LFS_START_SERVER = false
OFFLINE_MODE = true
APP_DATA_PATH = /data/gitea

[database]
DB_TYPE = sqlite3
PATH = /data/gitea/gitea.db
SQLITE_JOURNAL_MODE = WAL

[repository]
ROOT = /data/git/repositories
DEFAULT_BRANCH = main

[security]
INSTALL_LOCK = true
SECRET_KEY = dormouse-lab-secret-key-not-a-flag
INTERNAL_TOKEN = eyJhbGciOiJIUzUxMiJ9.dormouse_lab_internal_token_not_a_flag_0000000000000.dormouse_lab_internal_token_signature_not_a_flag_000000000000000000
; Lab creds are intentionally simple (alice / alice). Relax the password policy so they are allowed.
MIN_PASSWORD_LENGTH = 4
PASSWORD_COMPLEXITY = off
PASSWORD_CHECK_PWN = false

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
ENABLE_NOTIFY_MAIL = false

[mailer]
ENABLED = false

[actions]
ENABLED = false

[session]
PROVIDER = file

[log]
MODE = console
LEVEL = warn
ROOT_PATH = /data/gitea/log

[lfs]
PATH = /data/git/lfs

[cron]
ENABLED = false
